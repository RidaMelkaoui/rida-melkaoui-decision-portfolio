name: Career OS Daily Application & Dispatch Engine

on:
  schedule:
    # Runs at 07:30 UTC every day (08:30 AM Morocco time)
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-sweep-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Sweep, Check Replies & Dispatch Morning Batch
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'ridamelkaouiofficial@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || 'rnwreexrgtktocac' }}
          PORTFOLIO_URL: "https://ridamelkaoui.github.io/rida-melkaoui-decision-portfolio/"
          LINKEDIN_URL: "https://www.linkedin.com/in/rida-melkaoui-7bab50256/"
          CANDIDATE_NAME: "Rida Melkaoui"
          CANDIDATE_TITLE: "Industrial Engineer | Decision & Data Analytics Engineer"
          CANDIDATE_PHONE: "+212 620 999 885"
          CANDIDATE_EMAIL: "ridamelkaouiofficial@gmail.com"
          CANDIDATE_LOCATION: "Kenitra / Salé, Morocco"
        run: |
          python run_career_os.py --check-replies
          python run_career_os.py --daily-sweep
          python run_career_os.py --approve all
          python run_career_os.py --dispatch

      - name: Commit & Push Updated Database and Daily Briefing Report
        run: |
          git config --global user.name "Career OS Bot"
          git config --global user.email "bot@career-os.local"
          git add application-system/data/career_os.db deliverables/DAILY_APPLICATION_REPORT.md deliverables/reports/ deliverables/applications/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Career OS daily sweep & dispatch [skip ci]" && git push)
